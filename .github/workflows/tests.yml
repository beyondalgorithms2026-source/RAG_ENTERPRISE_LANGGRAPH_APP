name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No Docker, no database, no model. Every test in this suite runs offline;
      # the only network access is installing dependencies.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Red-team scenarios
        run: python -m rag_enterprise_langgraph.cli --red-team
