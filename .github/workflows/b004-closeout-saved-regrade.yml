name: b004-closeout-saved-answer-regrade

on:
  push:
    branches: [b004/closeout]
    paths:
      - .github/workflows/b004-closeout-saved-regrade.yml
      - src/rag_enterprise_langgraph/eval_judge.py
      - scripts/merge_saved_regrade.py
      - scripts/generate_candidate_evidence.py
      - scripts/generate_red_team_release.py

permissions:
  contents: write
  actions: read

jobs:
  regrade-preserved-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b004/closeout
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APP
        run: python -m pip install -e .

      - name: Download preserved 90-answer artifact
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10482194231"
          github-token: ${{ github.token }}
          repository: beyondalgorithms2026-source/RAG_ENTERPRISE_LANGGRAPH_APP
          run-id: "35186725102"
          path: preserved

      - name: Regrade only OM-004 and OM-069
        env:
          EVAL_OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
        run: |
          set +e
          python scripts/regrade_saved_answers.py \
            --pack config/eval-set-operations-manual-v3.2-candidate.json \
            --fixture preserved/manual-eval-report.json \
            --output preserved/two-case-regrade.json \
            --semantic-judge \
            --case-id OM-004 \
            --case-id OM-069
          result=$?
          if [ -f preserved/two-case-regrade.json ]; then
            jq -r '.rows[] | "\(.case_id): \(.judge_metadata.failure_reason // "graded")"' \
              preserved/two-case-regrade.json >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r reason; do
              echo "::error title=Saved-answer regrade::$reason"
            done < <(jq -r '.rows[] | select(.failure_class == "infrastructure") | "\(.case_id): \(.judge_metadata.failure_reason)"' preserved/two-case-regrade.json)
          fi
          exit "$result"

      - name: Recombine without regenerating answers
        run: |
          python scripts/merge_saved_regrade.py \
            preserved/eval-report.json \
            preserved/two-case-regrade.json \
            docs/evaluation/candidate-v2-report.json
          python -c 'import json; p=json.load(open("docs/evaluation/candidate-v2-report.json")); assert p["total"] == 90; assert len({r["case_id"] for r in p["rows"]}) == 90; assert p["transport_failures"] == p["grader_failures"] == p["other_infrastructure_failures"] == 0; assert p["refusal_passed"] == p["refusal_total"] == 8; assert p["safe_boundary_passed"] == p["safe_boundary_total"] == 2; assert p["release_notes"]["saved_answer_regrade_case_ids"] == ["OM-004", "OM-069"]; assert p["release_notes"]["answers_regenerated"] is False'

      - name: Generate candidate and red-team release evidence
        run: |
          python scripts/generate_candidate_evidence.py \
            docs/evaluation/candidate-v2-report.json \
            --status-out docs/evaluation/status.json \
            --html-out docs/evaluation/index.html
          python scripts/generate_red_team_release.py \
            docs/evaluation/candidate-v2-report.json \
            docs/evaluation/red-team-release.json
          sha256sum \
            docs/evaluation/candidate-v2-report.json \
            docs/evaluation/status.json \
            docs/evaluation/red-team-release.json \
            > docs/evaluation/SHA256SUMS

      - name: Commit machine-generated evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evaluation/candidate-v2-report.json docs/evaluation/status.json docs/evaluation/index.html docs/evaluation/red-team-release.json docs/evaluation/SHA256SUMS
          git diff --cached --check
          git commit -m "Publish B004 v2 candidate evidence"
          git push origin HEAD:b004/closeout
