[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-enterprise-langgraph"
version = "0.1.0"
description = "Minimal LangGraph app that uses the rag-enterprise-mcp server as its tool layer."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.136,<0.142",
  "langchain>=1.3.2,<1.4",
  "langchain-mcp-adapters>=0.2.2,<0.3",
  # langchain-mcp-adapters 0.2.x imports RequestContext from mcp.shared.context,
  # which mcp 2.x removed. Unpinned, a clean install resolves mcp 2.x and the
  # app fails on import. Pinned to the major version the suite is tested against.
  "mcp>=1.27,<2",
  # Both provider packages are declared because the model provider is selected at
  # runtime by RAG_AGENT_MODEL_PROVIDER. Ollama is the default for local use.
  "langchain-ollama>=1.1,<2",
  "langchain-openai>=1.2.2,<1.3",
  "langgraph>=1.2.2,<1.3",
  "python-dotenv>=1.2,<2",
  "pydantic-settings>=2.14.1,<3",
  "uvicorn>=0.48,<0.49",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10", "httpx>=0.28,<1"]

[project.scripts]
rag-enterprise-agent = "rag_enterprise_langgraph.cli:main"
rag-enterprise-api = "rag_enterprise_langgraph.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_enterprise_langgraph = ["static/*", "prompt_assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length — formatter handles what it can; remaining are strings/URLs
  "B008",   # function call in default — intentional FastAPI Query() pattern
  "RUF001", # ambiguous unicode — intentional curly quotes in user-facing strings
  "SIM102", # nested if — sometimes clearer than flattened condition
  "SIM103", # return condition directly — sometimes clearer with explicit if/return
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
