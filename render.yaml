services:
  - type: web
    name: rag-enterprise-governance-demo
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: bash scripts/render_build.sh
    startCommand: python -m uvicorn rag_enterprise_langgraph.server:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: RAG_AGENT_MCP_SERVER_REPO
        value: .render/mcp-server
      - key: RAG_BACKEND_BASE_URL
        value: https://rag-enterprise-starter-demo.onrender.com
      - key: RAG_BACKEND_TIMEOUT_SECONDS
        value: "300"
      # Verified synthesis: recovered answers are rewritten from the evidence and shown only if
      # every number and name is found in the source; otherwise the verbatim passage is shown.
      - key: RAG_AGENT_ENABLE_SYNTHESIS
        value: "true"
      - key: RAG_AGENT_MODEL_PROVIDER
        value: openai
      - key: RAG_AGENT_MODEL_NAME
        value: gpt-4o-mini-2024-07-18
      - key: RAG_AGENT_MODEL_TEMPERATURE
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: RAG_AGENT_PUBLIC_DEMO
        value: "true"
      - key: RAG_AGENT_PUBLIC_BACKEND_URL
        value: https://rag-enterprise-starter-demo.onrender.com
      - key: RAG_AGENT_EVIDENCE_STATUS_PATH
        value: docs/evaluation/status.json
      - key: RAG_AGENT_RED_TEAM_LATEST_PATH
        value: docs/evaluation/red-team-release.json
      - key: RAG_AGENT_AUDIT_LOG_PATH
        value: config/demo/audit-log.jsonl
      - key: RAG_AGENT_RECORDED_COMPARISONS_PATH
        value: config/demo/before-after-recorded.json
